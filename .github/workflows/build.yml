name: build
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      # The scan state is cached under a per-run key. restore-keys falls back to the newest previous run.
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: sigsum-scan-${{ github.run_id }}
          restore-keys: sigsum-scan-
      - run: npm run build
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: sigsum-scan-${{ github.run_id }}
      # Cloudflare Pages deploys from Git, so the fresh data.json has to land on main.
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add site/data.json
          git diff --cached --quiet || { git commit -m "Refresh data.json" && git push; }
